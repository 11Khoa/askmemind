name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: askmemind
          POSTGRES_PASSWORD: test
          POSTGRES_DB: askmemind_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U askmemind -d askmemind_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://askmemind:test@localhost:5432/askmemind_test

      SECRET_KEY: test-secret-key

      NVIDIA_API_KEY: test-nvidia-key
      GROQ_API_KEY: test-groq-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: python -m pytest backend/tests --tb=short -q