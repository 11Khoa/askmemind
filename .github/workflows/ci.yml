name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: askmemind
          POSTGRES_PASSWORD: test
          POSTGRES_DB: askmemind_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U askmemind -d askmemind_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://askmemind:test@localhost:5432/askmemind_test

      SECRET_KEY: test-secret-key

      NVIDIA_API_KEY: test-nvidia-key
      GROQ_API_KEY: test-groq-key
      REDIS_URL: redis://localhost:6379/15
      AUTH_TEST_REDIS_URL: redis://localhost:6379/15
      ENABLE_REGISTRATION: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Cache pinned OCR models
        uses: actions/cache@v4
        with:
          path: backend/models/ocr
          key: ocr-models-${{ runner.os }}-${{ hashFiles('backend/app/services/extraction/ocr_assets.py') }}

      - name: Verify OCR models and real bilingual scan extraction
        working-directory: backend
        run: |
          python -m app.commands.prepare_ocr_models
          python -m app.commands.check_pdf_ocr

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests --tb=short -q
